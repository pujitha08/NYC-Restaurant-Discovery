# Streamlit settings for the app (read when `streamlit run` is started from the repo root).
# Light theme, one warm accent, high contrast (text and accent both clear WCAG AA on their backgrounds: tests/test_streamlit_config.py).
# Fonts are the system fonts (no web fonts); no usage statistics are sent.

[theme]
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAF3EA"
textColor = "#1C1917"
font = "sans serif"

[browser]
gatherUsageStats = false
