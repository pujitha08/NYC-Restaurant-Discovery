# Streamlit settings for the app (read when `streamlit run` is started from the repo root).
# Light theme, one warm accent, high contrast (text and accent both clear WCAG AA on their backgrounds: tests/test_streamlit_config.py).
# The colors match PALETTE in app/styles.py. Fonts are the system fonts (no web fonts); no usage statistics are sent.

[theme]
base = "light"
primaryColor = "#B4461E"
backgroundColor = "#FBF7F2"
secondaryBackgroundColor = "#F3ECE3"
textColor = "#1F1B16"
font = "sans serif"

[browser]
gatherUsageStats = false
